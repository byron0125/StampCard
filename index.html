<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我們的集點簿</title>
<style>
:root {
  --green: #477b62;
  --pale: #edf5ef;
  --ink: #283b31;
  --muted: #718077;
  --line: #dce7df;
  --white: #fff;
  --red: #b74d4d;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f5f8f5;
  color: var(--ink);
  font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
}
header {
  padding: 24px 16px;
  text-align: center;
  background: var(--pale);
}
header h1 { margin: 0 0 6px; font-size: 25px; }
header p { margin: 0; color: var(--muted); font-size: 14px; }
main { max-width: 850px; margin: auto; padding: 16px; }
.card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px #263d3010;
}
h2 { font-size: 18px; margin: 0 0 14px; }
h3 { font-size: 16px; margin: 12px 0 8px; }
label { display: block; font-size: 13px; margin: 10px 0 5px; }
input, select, textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #cad8ce;
  border-radius: 9px;
  background: white;
  color: var(--ink);
  font: inherit;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  background: var(--green);
  color: white;
  font: inherit;
  cursor: pointer;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button.secondary { background: #e7efe9; color: var(--ink); }
button.danger { background: #f9e9e8; color: var(--red); }
button.small { padding: 6px 9px; font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--pale); border-radius: 12px; padding: 12px; }
.stat span { display: block; color: var(--muted); font-size: 12px; }
.stat strong { display: block; font-size: 23px; margin-top: 4px; }
nav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
nav button { flex: 1; min-width: 72px; white-space: nowrap; }
nav button.active { background: #274f3b; }
.reward {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.reward strong { display: block; }
.reward small { color: var(--muted); }
.list { display: grid; gap: 8px; }
.tx {
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.tx:last-child { border-bottom: 0; }
.tx .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.plus { color: #26784e; font-weight: 700; white-space: nowrap; }
.minus { color: var(--red); font-weight: 700; white-space: nowrap; }
.muted { color: var(--muted); font-size: 13px; }
.hidden { display: none !important; }
.status { font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
.status.error { color: var(--red); }
.status.ok { color: var(--green); }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
@media (max-width: 520px) {
  main { padding: 10px; }
  .grid { grid-template-columns: 1fr; }
  .stats { gap: 5px; }
  .stat { padding: 9px; }
  .stat strong { font-size: 19px; }
}
</style>
</head>
<body>
<header>
  <h1>🌱 我們的集點簿</h1>
  <p>每天一點點努力，累積自己的小成就</p>
</header>

<main>
  <section class="card">
    <h2>連線設定</h2>
    <label for="apiUrl">Apps Script 網頁應用程式網址（/exec）</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="pin">家庭 PIN</label>
    <input id="pin" type="password" autocomplete="off" placeholder="202530">
    <label for="operator">目前操作家長</label>
    <input id="operator" maxlength="30" placeholder="例如：爸爸">
    <div class="actions">
      <button id="connectBtn" onclick="connect()">儲存設定並連線</button>
      <button class="secondary" onclick="forgetSettings()">清除本機設定</button>
    </div>
    <div id="connectionStatus" class="status muted">尚未連線</div>
    <p class="muted">連線設定只儲存在目前裝置的瀏覽器。另一位家長第一次使用時，也要輸入相同網址與 PIN。</p>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="stats">
        <div class="stat"><span>目前點數</span><strong id="balance">0</strong></div>
        <div class="stat"><span>累積獲得</span><strong id="earned">0</strong></div>
        <div class="stat"><span>累積兌換</span><strong id="spent">0</strong></div>
      </div>
    </div>

    <nav>
      <button class="active" data-tab="home" onclick="showTab('home',this)">集點首頁</button>
      <button data-tab="history" onclick="showTab('history',this)">交易紀錄</button>
      <button data-tab="rules" onclick="showTab('rules',this)">獎勵設定</button>
      <button data-tab="backup" onclick="showTab('backup',this)">資料備份</button>
    </nav>

    <section id="tab-home">
      <div class="card">
        <h2>🎁 可以兌換的獎勵</h2>
        <div id="rewardList" class="list"></div>
      </div>

      <div class="card">
        <h2>✨ 幫孩子加點</h2>
        <label for="addPoints">增加點數</label>
        <input id="addPoints" type="number" min="1" max="100000" step="1" placeholder="例如：5">
        <label for="addNote">原因或備註</label>
        <input id="addNote" maxlength="200" placeholder="例如：自己收好玩具">
        <div class="actions">
          <button onclick="addPoints()">確認加點</button>
        </div>
      </div>
    </section>

    <section id="tab-history" class="hidden">
      <div class="card">
        <h2>📒 所有交易紀錄</h2>
        <p class="muted">取消交易會新增一筆反向紀錄，保留原始紀錄方便查帳。</p>
        <div id="historyList" class="list"></div>
      </div>
    </section>

    <section id="tab-rules" class="hidden">
      <div class="card">
        <h2>⚙️ 獎勵項目設定</h2>
        <div id="rulesList" class="list"></div>
        <hr>
        <h3 id="rewardFormTitle">新增獎勵</h3>
        <input id="rewardId" type="hidden">
        <label for="rewardName">獎勵名稱</label>
        <input id="rewardName" maxlength="80" placeholder="例如：轉蛋">
        <label for="rewardCost">所需點數</label>
        <input id="rewardCost" type="number" min="0" max="100000" step="1" value="20">
        <label><input id="rewardEnabled" type="checkbox" checked style="width:auto"> 啟用此獎勵</label>
        <div class="actions">
          <button onclick="saveReward()">儲存獎勵</button>
          <button class="secondary" onclick="clearRewardForm()">清除表單</button>
        </div>
        <hr>
        <h3>初始點數</h3>
        <p class="muted">這是額外的起始點數，修改後會直接影響目前餘額。</p>
        <label for="initialPoints">初始點數</label>
        <input id="initialPoints" type="number" min="0" max="1000000" step="1">
        <div class="actions">
          <button onclick="saveInitialPoints()">儲存初始點數</button>
        </div>
      </div>
    </section>

    <section id="tab-backup" class="hidden">
      <div class="card">
        <h2>💾 JSON 資料備份</h2>
        <p>匯出目前獎勵設定、初始點數及全部交易紀錄。建議定期下載並保存。</p>
        <div class="actions">
          <button onclick="exportJson()">下載 JSON 備份</button>
        </div>
        <hr>
        <h3>匯入備份</h3>
        <p class="muted">匯入會覆蓋目前的獎勵項目與交易紀錄。請先下載現有資料備份。</p>
        <label for="importFile">選擇 JSON 檔案</label>
        <input id="importFile" type="file" accept=".json,application/json">
        <div class="actions">
          <button class="danger" onclick="importJson()">匯入並覆蓋目前資料</button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="secondary" onclick="refreshData()">重新整理資料</button>
    </div>
    <div id="appStatus" class="status muted"></div>
  </section>
</main>

<script>
'use strict';

let appData = null;
let busy = false;

const $ = id => document.getElementById(id);

function status(message, error = false, target = 'appStatus') {
  const el = $(target);
  el.textContent = message;
  el.className = 'status ' + (error ? 'error' : 'ok');
}

function getConfig() {
  const url = $('apiUrl').value.trim();
  const pin = $('pin').value;
  const operator = $('operator').value.trim();

  if (!/^https:\/\/script\.google\.com\/macros\/s\/AKfycby8FT8dQG3Bnc0FacInIiu8QwykKpuNPATXO95ktLiU4sFW4ogN7sHhb10MEmqhZ8Da4A[^/]+\/exec$/.test(url)) {
    throw new Error('請輸入正確的 Apps Script /exec 網址');
  }
  if (!pin) throw new Error('請輸入家庭 PIN');

  return { url, pin, operator };
}

function saveLocalConfig() {
  const c = getConfig();
  localStorage.setItem('familyPointsConfig', JSON.stringify(c));
  return c;
}

function loadLocalConfig() {
  try {
    const c = JSON.parse(localStorage.getItem('familyPointsConfig') || '{}');
    $('apiUrl').value = c.url || '';
    $('pin').value = c.pin || '';
    $('operator').value = c.operator || '';
  } catch (_) {}
}

function forgetSettings() {
  if (!confirm('確定清除這台裝置儲存的連線設定？')) return;
  localStorage.removeItem('familyPointsConfig');
  $('apiUrl').value = '';
  $('pin').value = '';
  $('operator').value = '';
  $('app').classList.add('hidden');
  status('本機設定已清除', false, 'connectionStatus');
}

function jsonpRead() {
  return new Promise((resolve, reject) => {
    let c;
    try { c = getConfig(); } catch (e) { reject(e); return; }

    const callback = 'familyPointsCallback_' +
      Date.now() + '_' + Math.floor(Math.random() * 1000000);
    const script = document.createElement('script');
    let finished = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      delete window[callback];
      script.remove();
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('讀取逾時，請確認網址、PIN 及部署權限'));
    }, 15000);

    window[callback] = result => {
      cleanup();
      if (!result || !result.ok) {
        reject(new Error(result?.message || '讀取失敗'));
      } else {
        resolve(result.data);
      }
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('無法連線，請檢查 Apps Script 部署網址'));
    };

    script.src = c.url + '?action=read&pin=' +
      encodeURIComponent(c.pin) + '&callback=' + callback +
      '&_=' + Date.now();

    document.body.appendChild(script);
  });
}

/*
 * Apps Script 跨網域 POST 使用 no-cors 時，
 * 瀏覽器無法讀取伺服器回傳的錯誤內容。
 * 因此送出後會重新讀取資料；若沒有更新，請檢查
 * Apps Script 執行紀錄及試算表。
 */
async function postAction(action, payload = {}) {
  if (busy) throw new Error('上一個操作尚未完成，請稍候');
  busy = true;
  $('connectBtn').disabled = true;

  try {
    const c = saveLocalConfig();
    status('正在送出操作並確認資料…');

    await fetch(c.url, {
      method: 'POST',
      mode: 'no-cors',
      body: new URLSearchParams({
        action,
        pin: c.pin,
        operator: c.operator,
        payload: JSON.stringify(payload)
      })
    });

    await new Promise(resolve => setTimeout(resolve, 1200));
    await refreshData(false);
    status('已送出操作並重新讀取資料。請確認紀錄及點數是否符合預期。');
  } finally {
    busy = false;
    $('connectBtn').disabled = false;
  }
}

async function connect() {
  try {
    saveLocalConfig();
    status('正在連線…', false, 'connectionStatus');
    appData = await jsonpRead();
    $('app').classList.remove('hidden');
    render();
    status('連線成功', false, 'connectionStatus');
    status('資料已載入');
  } catch (e) {
    status(e.message, true, 'connectionStatus');
  }
}

async function refreshData(showMessage = true) {
  try {
    appData = await jsonpRead();
    $('app').classList.remove('hidden');
    render();
    if (showMessage) status('資料已更新');
  } catch (e) {
    status(e.message, true);
    throw e;
  }
}

function showTab(name, button) {
  ['home', 'history', 'rules', 'backup'].forEach(tab => {
    $('tab-' + tab).classList.toggle('hidden', tab !== name);
  });
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b === button);
  });
}

function makeElement(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}

function render() {
  if (!appData) return;

  $('balance').textContent = appData.balance;
  const txs = appData.transactions || [];

  $('earned').textContent = txs
    .filter(t => t.delta > 0 && t.status !== '已取消')
    .reduce((s, t) => s + t.delta, 0);

  $('spent').textContent = Math.abs(txs
    .filter(t => t.delta < 0 && t.status !== '已取消')
    .reduce((s, t) => s + t.delta, 0));

  $('initialPoints').value = appData.initialPoints ?? 0;

  renderRewards();
  renderHistory();
  renderRules();
}

function renderRewards() {
  const root = $('rewardList');
  root.replaceChildren();

  const rewards = (appData.rewards || []).filter(r => r.enabled);

  if (!rewards.length) {
    root.append(makeElement('p', 'muted', '目前沒有啟用的獎勵項目。'));
    return;
  }

  rewards.forEach(reward => {
    const card = makeElement('div', 'reward');
    const info = makeElement('div');
    info.append(makeElement('strong', '', reward.name));
    info.append(makeElement('small', '', reward.cost + ' 點'));
    const btn = makeElement('button', '', '兌換');
    btn.disabled = appData.balance < reward.cost;
    btn.onclick = async () => {
      if (!confirm('確定要兌換「' + reward.name + '」？需要 ' +
          reward.cost + ' 點。')) return;
      try {
        await postAction('redeem', { rewardId: reward.id });
      } catch (e) { status(e.message, true); }
    };
    card.append(info, btn);
    root.append(card);
  });
}

function renderHistory() {
  const root = $('historyList');
  root.replaceChildren();
  const txs = appData.transactions || [];

  if (!txs.length) {
    root.append(makeElement('p', 'muted', '目前還沒有交易紀錄。'));
    return;
  }

  txs.forEach(t => {
    const row = makeElement('div', 'tx');
    const left = makeElement('div');
    left.append(makeElement('strong', '', t.item || t.type));

    const detail = [t.type, t.operator, t.status, t.note]
      .filter(Boolean).join(' · ');
    left.append(makeElement('div', 'meta', detail));
    left.append(makeElement('div', 'meta', t.time || ''));

    const right = makeElement('div');
    right.style.textAlign = 'right';
    right.append(makeElement(
      'div',
      t.delta >= 0 ? 'plus' : 'minus',
      (t.delta > 0 ? '+' : '') + t.delta + ' 點'
    ));

    if (t.status === '有效' && t.type !== '復原') {
      const btn = makeElement('button', 'danger small', '取消／復原');
      btn.style.marginTop = '6px';
      btn.onclick = async () => {
        if (!confirm('確定復原這筆交易？系統會新增一筆反向交易。')) return;
        try {
          await postAction('cancel', { transactionId: t.id });
        } catch (e) { status(e.message, true); }
      };
      right.append(btn);
    }

    row.append(left, right);
    root.append(row);
  });
}

function renderRules() {
  const root = $('rulesList');
  root.replaceChildren();

  (appData.rewards || []).forEach(reward => {
    const row = makeElement('div', 'reward');
    const info = makeElement('div');
    info.append(makeElement('strong', '', reward.name));
    info.append(makeElement('small', '',
      reward.cost + ' 點 · ' + (reward.enabled ? '啟用中' : '已停用')));

    const edit = makeElement('button', 'secondary small', '編輯');
    edit.onclick = () => {
      $('rewardId').value = reward.id;
      $('rewardName').value = reward.name;
      $('rewardCost').value = reward.cost;
      $('rewardEnabled').checked = reward.enabled;
      $('rewardFormTitle').textContent = '編輯獎勵';
      $('rewardName').focus();
    };

    row.append(info, edit);
    root.append(row);
  });
}

async function addPoints() {
  const points = Number($('addPoints').value);
  const note = $('addNote').value.trim();

  if (!Number.isInteger(points) || points <= 0 || points > 100000) {
    status('請輸入 1 至 100000 的整數點數', true);
    return;
  }

  try {
    await postAction('addPoints', {
      points,
      item: note || '手動加點',
      note
    });
    $('addPoints').value = '';
    $('addNote').value = '';
  } catch (e) { status(e.message, true); }
}

async function saveReward() {
  const name = $('rewardName').value.trim();
  const cost = Number($('rewardCost').value);
  if (!name) { status('請輸入獎勵名稱', true); return; }
  if (!Number.isInteger(cost) || cost < 0 || cost > 100000) {
    status('所需點數須為 0 至 100000 的整數', true);
    return;
  }

  try {
    await postAction('saveReward', {
      id: $('rewardId').value,
      name,
      cost,
      enabled: $('rewardEnabled').checked
    });
    clearRewardForm();
  } catch (e) { status(e.message, true); }
}

function clearRewardForm() {
  $('rewardId').value = '';
  $('rewardName').value = '';
  $('rewardCost').value = 20;
  $('rewardEnabled').checked = true;
  $('rewardFormTitle').textContent = '新增獎勵';
}

async function saveInitialPoints() {
  const points = Number($('initialPoints').value);
  if (!Number.isInteger(points) || points < 0 || points > 1000000) {
    status('初始點數須為 0 至 1000000 的整數', true);
    return;
  }
  try {
    await postAction('setInitialPoints', { points });
  } catch (e) { status(e.message, true); }
}

function exportJson() {
  if (!appData) { status('請先連線並載入資料', true); return; }

  const blob = new Blob(
    [JSON.stringify(appData, null, 2)],
    { type: 'application/json;charset=utf-8' }
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'family-points-backup-' +
    new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function importJson() {
  const file = $('importFile').files[0];
  if (!file) { status('請先選擇 JSON 備份檔案', true); return; }

  if (!confirm('匯入會覆蓋目前所有獎勵及交易紀錄。確定已備份現有資料嗎？')) {
    return;
  }

  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.rewards) ||
        !Array.isArray(data.transactions)) {
      throw new Error('檔案格式不正確，請選擇本集點簿匯出的 JSON');
    }
    await postAction('importJson', { data });
    $('importFile').value = '';
  } catch (e) {
    status('匯入失敗：' + e.message, true);
  }
}

loadLocalConfig();
</script>
</body>
</html>
